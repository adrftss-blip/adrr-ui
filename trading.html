<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>التداول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; background: #000; color: #fff;
      font-family: 'Cairo', sans-serif; overflow: hidden;
    }

    body { display: flex; justify-content: center; align-items: center; }

    .phone-container {
      width: 100%; max-width: 430px; height: 100vh; background: #000;
      position: relative; overflow: hidden;
    }

    .content {
      width: 100%; height: calc(100vh - 120px); background: #000;
      display: flex; align-items: center; justify-content: center; padding: 20px; overflow: hidden;
    }

    .page-title {
      font-size: 34px; font-weight: 700; letter-spacing: 0.5px; color: #f2f2f2;
      text-shadow: 0 0 1px rgba(255,255,255,0.2);
    }

    /* Seven banner images: upload image-1.jpg through image-7.jpg beside trading.html */
    .content {
      display: block;
      height: calc(100vh - 120px);
      padding: 44px 12px 30px;
      overflow-y: auto;
      scroll-padding-top: 20px;
    }
    .image-gallery {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .image-slot {
      display: block;
      width: 100%;
      aspect-ratio: 1536 / 566;
      overflow: hidden;
      border-radius: 10px;
      background: #151515;
      border: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      box-shadow: none;
    }
    /* Keep Android/browser tap and focus states from painting a blue tile. */
    .image-slot:active,
    .image-slot:focus,
    .image-slot:focus-visible {
      background: #151515;
      outline: none;
      box-shadow: none;
    }
    .image-slot img { -webkit-tap-highlight-color: transparent; }
    .image-slot img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    /* تفاصيل العرض: الصورة الثانية لا تظهر إلا بعد الضغط على شراء */
    .gallery-open { border: 0; padding: 0; cursor: pointer; }
    .gallery-open:active { transform: none; }
    body.details-open .content { visibility: hidden; }
    .details-modal {
      position: fixed; inset: 0; z-index: 200;
      display: none; background: rgba(0, 0, 0, 0.18);
      -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px);
      overflow-y: auto; padding: 18px 12px 125px;
    }
    .details-modal.show { display: block; }
    .details-close {
      position: sticky; top: 0; z-index: 3; display: block; margin: 0 0 12px auto;
      width: 40px; height: 40px; border: 0; border-radius: 50%;
      color: #fff; background: #292929; font-size: 26px; cursor: pointer;
    }
    .selected-banner {
      display: block; width: 100%; aspect-ratio: 1536 / 566;
      object-fit: cover; border-radius: 10px; margin: 0 0 8px; background: transparent;
    }
    .buy-action {
      display: flex; width: 100%; min-height: 54px; margin: 0 0 8px;
      border: 0; border-radius: 12px; background: #079b7e; color: #fff;
      font: 800 28px 'Cairo', sans-serif; align-items: center; justify-content: center;
      padding: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .buy-action.gone { display: none; }
    .result-stage {
      display: none; position: relative; width: 100%; aspect-ratio: 976 / 402;
      overflow: hidden; overflow: clip; isolation: isolate;
      background: transparent; margin: 0; padding: 0;
      border-radius: 14px; clip-path: inset(0 round 14px);
    }
    .result-stage.show { display: block; animation: none; }
    .result-background {
      display: block; width: 100%; height: 100%; object-fit: cover;
      border-radius: inherit;
    }
    /* Removed the red overlay so it cannot create a red strip at the bottom. */
    .result-stage::after { content: none; }
    .result-balance {
      position: absolute; z-index: 1; left: 5%; top: 20%; width: 90%; height: 22%;
      border-radius: 0; background: transparent; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font: 800 clamp(18px, 5.5vw, 34px) 'Cairo', sans-serif;
      white-space: nowrap; direction: rtl; padding: 0 6px;
      text-shadow: 0 1px 3px rgba(0,0,0,.45);
    }
    @keyframes resultShake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-2px); }
      50% { transform: translateX(2px); }
      75% { transform: translateX(-1px); }
      100% { transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) { .result-stage.show { animation: none; } }

    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; width: 100%; max-width: 430px;
      height: 110px; background: rgba(0, 0, 0, 0.95); border-top: 1px solid rgba(255,255,255,0.08);
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: flex-start;
      padding: 10px 12px 12px; gap: 6px; z-index: 100;
    }

    .nav-item {
      -webkit-tap-highlight-color: transparent;
      outline: none;
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; text-decoration: none; color: rgba(255,255,255,0.72); background: transparent; border: none;
      border-radius: 16px; padding: 10px 6px 8px; min-height: 70px; transition: all 0.18s ease;
      transform: translateY(0); cursor: pointer; font-family: 'Cairo', sans-serif;
    }

    .nav-item i { font-size: 24px; line-height: 1; transition: transform 0.18s ease, color 0.18s ease; }
    .nav-item span { font-size: 11px; line-height: 1.2; font-weight: 500; letter-spacing: 0.2px; white-space: nowrap; }

    .nav-item:focus, .nav-item:focus-visible {
      outline: none;
      background: transparent;
    }

    .nav-item:hover { transform: translateY(-1px); }
    .nav-item:active { transform: translateY(0) scale(0.98); }

    .nav-item.active {
      background: transparent;
      color: #fff;
    }

    .nav-item.active i { transform: scale(1.04); color: #fff; }

    .nav-item.home-badge { position: relative; }

    .badge-count {
      position: absolute; top: 2px; right: 12px; background: #ff3f66; color: #fff; font-size: 10px;
      font-weight: 700; padding: 2px 6px; border-radius: 10px; min-width: 24px; text-align: center; line-height: 1.4; display: block;
    }

    @media (max-width: 380px) {
      .nav-item i { font-size: 22px; }
      .nav-item span { font-size: 10px; }
      .page-title { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="phone-container">
    <main class="content" aria-label="معرض الصور">
      <section class="image-gallery">
        <button class="image-slot gallery-open" type="button" data-image="image-1.jpg" aria-label="فتح الصورة"><img src="image-1.jpg" alt="" onerror="this.style.display='none'"></button>
        <button class="image-slot gallery-open" type="button" data-image="image-2.jpg" aria-label="فتح الصورة"><img src="image-2.jpg" alt="" onerror="this.style.display='none'"></button>
        <button class="image-slot gallery-open" type="button" data-image="image-3.jpg" aria-label="فتح الصورة"><img src="image-3.jpg" alt="" onerror="this.style.display='none'"></button>
        <button class="image-slot gallery-open" type="button" data-image="image-4.jpg" aria-label="فتح الصورة"><img src="image-4.jpg" alt="" onerror="this.style.display='none'"></button>
        <button class="image-slot gallery-open" type="button" data-image="image-5.jpg" aria-label="فتح الصورة"><img src="image-5.jpg" alt="" onerror="this.style.display='none'"></button>
        <button class="image-slot gallery-open" type="button" data-image="image-6.jpg" aria-label="فتح الصورة"><img src="image-6.jpg" alt="" onerror="this.style.display='none'"></button>
        <button class="image-slot gallery-open" type="button" data-image="image-7.jpg" aria-label="فتح الصورة"><img src="image-7.jpg" alt="" onerror="this.style.display='none'"></button>
      </section>

  <script>
    (() => {
      const modal = document.getElementById('detailsModal');
      const selectedBanner = document.getElementById('selectedBanner');
      const closeButton = document.getElementById('detailsClose');
      const buyButton = document.getElementById('buyAction');
      const resultStage = document.getElementById('resultStage');
      let hideTimer = null;

      function resetPurchase() {
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = null;
        buyButton.classList.remove('gone');
        resultStage.classList.remove('show');
        resultStage.setAttribute('aria-hidden', 'true');
      }
      function openDetails(imageName) {
        resetPurchase();
        selectedBanner.src = imageName;
        document.body.classList.add('details-open');
        modal.classList.add('show');
        modal.setAttribute('aria-hidden', 'false');
      }
      function closeDetails() {
        resetPurchase();
        modal.classList.remove('show');
        document.body.classList.remove('details-open');
        modal.setAttribute('aria-hidden', 'true');
      }

      document.querySelectorAll('.gallery-open').forEach(card => {
        card.addEventListener('click', () => openDetails(card.dataset.image));
      });
      closeButton.addEventListener('click', closeDetails);
      modal.addEventListener('click', event => {
        if (event.target === modal) closeDetails();
      });
      buyButton.addEventListener('click', event => {
        event.stopPropagation();
        if (hideTimer) clearTimeout(hideTimer);
        buyButton.classList.add('gone');
        resultStage.classList.add('show');
        resultStage.setAttribute('aria-hidden', 'false');
        if (navigator.vibrate) navigator.vibrate([120, 70, 120, 70, 180]);
        hideTimer = setTimeout(() => {
          resultStage.classList.remove('show');
          resultStage.setAttribute('aria-hidden', 'true');
          buyButton.classList.remove('gone');
          hideTimer = null;
        }, 4000);
      });
    })();
  </script>
