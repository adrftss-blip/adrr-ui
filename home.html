  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; background: #000; color: #fff;
      font-family: 'Cairo', sans-serif; overflow: hidden;
    }

    body { display: flex; justify-content: center; align-items: center; }

    .phone-container {
      width: 100%; max-width: 430px; height: 100vh; background: #000;
      position: relative; overflow: hidden;
    }

    .content {
      width: 100%; height: calc(100vh - 120px); background: #000;
      display: flex; align-items: center; justify-content: center; padding: 20px; overflow: hidden;
    }

    .page-title {
      font-size: 34px; font-weight: 700; letter-spacing: 0.5px; color: #f2f2f2;
      text-shadow: 0 0 1px rgba(255,255,255,0.2);
    }

    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; width: 100%; max-width: 430px;
      height: 110px; background: rgba(0, 0, 0, 0.95); border-top: 1px solid rgba(255,255,255,0.08);
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: flex-start;
      padding: 10px 12px 12px; gap: 6px; z-index: 100;
    }

    .nav-item {
      -webkit-tap-highlight-color: transparent;
      outline: none;
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; text-decoration: none; color: rgba(255,255,255,0.72); background: transparent; border: none;
      border-radius: 16px; padding: 10px 6px 8px; min-height: 70px; transition: all 0.18s ease;
      transform: translateY(0); cursor: pointer; font-family: 'Cairo', sans-serif;
    }

    .nav-item i { font-size: 24px; line-height: 1; transition: transform 0.18s ease, color 0.18s ease; }
    .nav-item span { font-size: 11px; line-height: 1.2; font-weight: 500; letter-spacing: 0.2px; white-space: nowrap; }

    .nav-item:focus, .nav-item:focus-visible {
      outline: none;
      background: transparent;
    }

    .nav-item:hover { transform: translateY(-1px); }
    .nav-item:active { transform: translateY(0) scale(0.98); }

    .nav-item.active {
      background: transparent;
      color: #fff;
    }

    .nav-item.active i { transform: scale(1.04); color: #fff; }

    .nav-item.home-badge { position: relative; }

    .badge-count {
      position: absolute; top: 2px; right: 12px; background: #ff3f66; color: #fff; font-size: 10px;
      font-weight: 700; padding: 2px 6px; border-radius: 10px; min-width: 24px; text-align: center; line-height: 1.4; display: block;
    }


    /* عين تظهر عند الضغط على الرئيسية لمدة 7 ثوانٍ فقط */
    .eye-overlay {
      position: fixed; inset: 0; z-index: 9999; display: none;
      align-items: center; justify-content: center; background: #000;
      overflow: hidden;
    }
    .eye-overlay.show { display: flex; }
    .eye-overlay video {
      width: 100%; height: 100%; max-width: 430px;
      object-fit: contain; background: #000;
    }

    @media (max-width: 380px) {
      .nav-item i { font-size: 22px; }
      .nav-item span { font-size: 10px; }
      .page-title { font-size: 28px; }
    }
  </style>

  <script>
    (() => {
      const homeButton = document.querySelector('.nav-item.home-badge');
      const overlay = document.getElementById('eyeOverlay');
      const video = document.getElementById('eyeVideo');
      let hideTimer;
      function showEye(event) {
        event.preventDefault();
        clearTimeout(hideTimer);
        overlay.classList.add('show');
        overlay.setAttribute('aria-hidden', 'false');
        try { video.pause(); video.currentTime = 0; } catch (e) {}
        const playPromise = video.play();
        if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(() => {});
        hideTimer = setTimeout(hideEye, 7000);
      }
      function hideEye() {
        clearTimeout(hideTimer);
        overlay.classList.remove('show');
        overlay.setAttribute('aria-hidden', 'true');
        video.pause();
        try { video.currentTime = 0; } catch (e) {}
      }
      homeButton.addEventListener('click', showEye);
    })();
  </script>
