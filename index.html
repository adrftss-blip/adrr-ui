body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:12px}

.browser{display:block;color:#eee;text-decoration:none;font-size:25px;margin:26px 0 42px;cursor:pointer}
.note{color:#999;font-size:18px;line-height:1.8}.status{display:none;margin:16px 0 0;color:#ffb4ab;font-size:16px;line-height:1.7}

<h1>تسجيل الدخول إلى أوبتس</h1>
<p class="sub">ادخل بحسابك حتى تتمشى بأمانك واستخدامك<br>ومشترياتك ويا حسابك بأي جهاز تدخل منه.</p>
<button class="google" id="googleButton" type="button"><span>متابعة بحساب Google</span><span class="g">G</span></button>
<a class="browser" href="#" id="browserLogin">تسجيل الدخول بالمتصفح</a>
<p class="note">اختر حساب Google للمتابعة.</p>
<p class="status" id="status" role="alert"></p>
<div id="googleButtonHost" style="position:absolute;left:-10000px;top:-10000px"></div>
</section></div>
<script>
const GOOGLE_CLIENT_ID = '864322797605-1gtnb9uilmbm4a2uakrgha5u6jccpb0t.apps.googleusercontent.com';
const statusBox = document.getElementById('status');

function showError(message) {
  statusBox.textContent = message;
  statusBox.style.display = 'block';
  statusBox.style.color = '#ffb4ab';
}

function handleGoogleCredential(response) {
  if (response && response.credential) {
    // هذا انتقال للصفحة الرئيسية فقط؛ التحقق الآمن من الرمز يحتاج خادماً.
    sessionStorage.setItem('optes_google_credential_received', 'true');
    window.location.replace(new URL('home.html', window.location.href).href);
  } else {
    showError('لم يتم اختيار حساب Google. حاول مرة أخرى.');
  }
}

function startGoogle() {
  if (!window.google || !google.accounts || !google.accounts.id) {
    showError('خدمة Google لم تُحمّل بعد. تأكد من الاتصال بالإنترنت ثم أعد المحاولة.');
    return;
  }
  const host = document.getElementById('googleButtonHost');
  host.innerHTML = '';
  google.accounts.id.renderButton(host, {
    type: 'standard',
    theme: 'filled_black',
    size: 'large',
    text: 'continue_with',
    shape: 'pill',
    width: 320
  });
  const renderedButton = host.querySelector('[role="button"]');
  if (renderedButton) renderedButton.click();
}

document.getElementById('googleButton').addEventListener('click', startGoogle);
document.getElementById('browserLogin').addEventListener('click', event => {
  event.preventDefault();
  startGoogle();
});

window.addEventListener('load', () => {
  const waitForGoogle = () => {
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredential,
        auto_select: false,
        cancel_on_tap_outside: true
      });
    } else {
      setTimeout(waitForGoogle, 250);
    }
  };
  waitForGoogle();
});
</script></body></html>
