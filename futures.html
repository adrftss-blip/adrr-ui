<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الدردشة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; background: #000; color: #fff;
      font-family: 'Cairo', sans-serif; overflow: hidden;
    }
    body { display: flex; justify-content: center; align-items: center; }
    .phone-container {
      width: 100%; max-width: 430px; height: 100vh; background: #111;
      position: relative; overflow: hidden;
    }
    .support-screen {
      position: absolute; inset: 0 0 110px 0; background: #111;
      display: flex; flex-direction: column; min-height: 0;
    }
    .chat-header {
      min-height: 86px; display: flex; align-items: center; gap: 13px;
      padding: 14px 18px; background: #111; direction: rtl;
    }
    .header-action {
      color: #fff; background: transparent; border: 0; font-size: 25px;
      width: 35px; min-width: 35px; display: inline-flex; align-items: center;
      justify-content: center; cursor: pointer;
    }
    .header-divider { height: 34px; width: 1px; background: #292929; }
    .header-title {
      flex: 1; text-align: right; font-size: 23px; font-weight: 700;
      white-space: nowrap;
    }
    .bot-icon { font-size: 29px; line-height: 1; }
    .chat-content {
      flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px 20px;
      display: flex; flex-direction: column; gap: 24px;
    }
    .chat-date {
      color: #555; text-align: center; font-size: 20px; direction: ltr;
      margin: 0 0 4px;
    }
    .message {
      max-width: 88%; padding: 16px 18px; border-radius: 25px;
      font-size: 19px; line-height: 1.75; overflow-wrap: anywhere;
    }
    .message.user {
      align-self: flex-start; background: #fff; color: #111;
      border-radius: 25px; margin-bottom: 12px;
    }
    .message.support {
      align-self: flex-end; background: #1b1b1b; color: #bdbdbd;
      border: 2px solid #242424; border-radius: 25px; text-align: right;
    }
    .message.support strong { color: #e6e6e6; }
    .composer {
      margin: 12px 14px 16px; min-height: 76px; border-radius: 45px;
      background: #1b1b1b; display: flex; align-items: center;
      padding: 10px 13px 10px 10px; gap: 10px; direction: ltr;
    }
    .send-button {
      width: 52px; height: 52px; border-radius: 50%; border: 0;
      background: #666; color: #111; font-size: 25px; cursor: pointer;
      flex-shrink: 0;
    }
    .composer input {
      flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
      color: #fff; text-align: right; font: 19px 'Cairo', sans-serif;
      direction: rtl;
    }
    .composer input::placeholder { color: #85858b; opacity: 1; }
    .language-screen {
      display: none; position: absolute; inset: 0 0 110px; z-index: 50;
      background: #111; overflow-y: auto;
    }
    .language-header {
      height: 86px; display: flex; align-items: center; gap: 15px;
      padding: 15px 22px; border-bottom: 1px solid #1d1d1d;
    }
    .language-header h2 { flex: 1; font-size: 24px; }
    .language-list { display: flex; flex-direction: column; }
    .language-option {
      min-height: 73px; display: flex; align-items: center; justify-content: space-between;
      padding: 16px 25px; border: 0; background: transparent; color: #f4f4f4;
      font: 20px 'Cairo', sans-serif; text-align: right; cursor: pointer;
    }
    .language-option.selected { background: #1b1b1b; }
    .language-option .check { visibility: hidden; }
    .language-option.selected .check { visibility: visible; }
    .bottom-nav {
      position: absolute; left: 0; right: 0; bottom: 0; width: 100%;
      height: 110px; background: rgba(0,0,0,0.98);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: flex-start; padding: 10px 12px 12px; gap: 6px; z-index: 100;
    }
    .nav-item {
      -webkit-tap-highlight-color: transparent; outline: none; position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; text-decoration: none; color: rgba(255,255,255,0.72);
      background: transparent; border: none; border-radius: 16px;
      padding: 10px 6px 8px; min-height: 70px; transition: all .18s ease;
      cursor: pointer; font-family: 'Cairo', sans-serif;
    }
    .nav-item i { font-size: 24px; line-height: 1; transition: transform .18s ease, color .18s ease; }
    .nav-item span { font-size: 11px; line-height: 1.2; font-weight: 500; letter-spacing: .2px; white-space: nowrap; }
    .nav-item.active { background: transparent; color: #fff; }
    .nav-item.active i { transform: scale(1.04); color: #fff; }
    .badge-count {
      position: absolute; top: 2px; right: 12px; background: #ff3f66; color: #fff;
      font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px;
      min-width: 24px; text-align: center; line-height: 1.4; display: block;
    }
    @media (max-width: 380px) {
      .nav-item i { font-size: 22px; }
      .nav-item span { font-size: 10px; }
      .header-title { font-size: 20px; }
      .message { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div class="phone-container">
    <main class="support-screen" id="supportScreen">
      <header class="chat-header">
        <button class="header-action" id="backButton" aria-label="رجوع"><i class="fa-solid fa-arrow-right"></i></button>
        <span class="header-divider"></span>
        <span class="bot-icon" aria-hidden="true">🤖</span>
        <h1 class="header-title" id="supportTitle">دعم FBC</h1>
        <button class="header-action" id="languageButton" aria-label="اختيار اللغة"><i class="fa-solid fa-globe"></i></button>
        <button class="header-action" id="powerButton" aria-label="إيقاف"><i class="fa-solid fa-power-off"></i></button>
      </header>

      <section class="chat-content" id="chatContent" aria-label="محادثة الدعم">
        <div class="chat-date" id="currentDate"></div>
        <div class="message user" id="welcomeMessage">مرحباً بك في دعم FBC</div>
        <div class="message support" id="supportMessage">
          أهلاً بك في <strong>دعم FBC</strong>.<br>
          اكتب سؤالك هنا وسنساعدك قدر الإمكان.
        </div>
      </section>

      <form class="composer" id="chatForm">
        <button class="send-button" type="submit" aria-label="إرسال"><i class="fa-solid fa-arrow-up"></i></button>
        <input id="chatInput" type="text" placeholder="ادخل سؤالك" autocomplete="off" />
      </form>
    </main>

    <section class="language-screen" id="languageScreen" aria-label="اختيار اللغة">
      <header class="language-header">
        <button class="header-action" id="closeLanguages" aria-label="رجوع"><i class="fa-solid fa-arrow-right"></i></button>
        <span class="header-divider"></span>
        <h2>اللغة</h2>
      </header>
      <div class="language-list" id="languageList">
        <button class="language-option selected" data-lang="ar"><span>العربية</span><i class="fa-solid fa-check check"></i></button>
        <button class="language-option" data-lang="en"><span>English</span><i class="fa-solid fa-check check"></i></button>
        <button class="language-option" data-lang="ru"><span>Русский</span><i class="fa-solid fa-check check"></i></button>
        <button class="language-option" data-lang="ja"><span>日本語</span><i class="fa-solid fa-check check"></i></button>
        <button class="language-option" data-lang="es"><span>Español (Internacional)</span><i class="fa-solid fa-check check"></i></button>
        <button class="language-option" data-lang="vi"><span>Tiếng Việt</span><i class="fa-solid fa-check check"></i></button>
        <button class="language-option" data-lang="pt"><span>Português (Brasil)</span><i class="fa-solid fa-check check"></i></button>
        <button class="language-option" data-lang="fr"><span>Français (International)</span><i class="fa-solid fa-check check"></i></button>
        <button class="language-option" data-lang="zh"><span>中文繁體</span><i class="fa-solid fa-check check"></i></button>
        <button class="language-option" data-lang="id"><span>Bahasa Indonesia</span><i class="fa-solid fa-check check"></i></button>
        <button class="language-option" data-lang="hi"><span>हिंदी</span><i class="fa-solid fa-check check"></i></button>
        <button class="language-option" data-lang="ms"><span>Bahasa Melayu</span><i class="fa-solid fa-check check"></i></button>
        <button class="language-option" data-lang="bn"><span>বাংলা</span><i class="fa-solid fa-check check"></i></button>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="Bottom navigation">
      <a class="nav-item" href="wallet.html" aria-label="الرصيد">
        <i class="fa-solid fa-wallet"></i><span>الرصيد</span>
      </a>
      <a class="nav-item active" href="futures.html" aria-label="الدردشة">
        <i class="fa-solid fa-chart-line"></i><span>الدردشة</span>
      </a>
      <a class="nav-item" href="trading.html" aria-label="التداول">
        <i class="fa-solid fa-arrows-rotate"></i><span>التداول</span>
      </a>
      <a class="nav-item" href="markets.html" aria-label="المهام">
        <i class="fa-solid fa-chart-column"></i><span>المهام</span>
      </a>
      <a class="nav-item home-badge" href="home.html" aria-label="الصفحة الرئيسية">
        <span class="badge-count">99+</span><i class="fa-solid fa-house"></i><span>الرئيسية</span>
      </a>
    </nav>
  </div>

  <script>
    const dateElement = document.getElementById('currentDate');
    function updateDate() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      dateElement.textContent = `${yyyy}/${mm}/${dd}`;
    }
    updateDate();

    const supportScreen = document.getElementById('supportScreen');
    const languageScreen = document.getElementById('languageScreen');
    document.getElementById('languageButton').addEventListener('click', () => {
      languageScreen.style.display = 'block';
    });
    document.getElementById('closeLanguages').addEventListener('click', () => {
      languageScreen.style.display = 'none';
    });
    document.getElementById('backButton').addEventListener('click', () => {
      languageScreen.style.display = 'none';
    });
    document.getElementById('powerButton').addEventListener('click', () => {
      document.getElementById('chatInput').focus();
    });

    const translations = {
      ar: {title:'دعم FBC', welcome:'مرحباً بك في دعم FBC', support:'أهلاً بك في <strong>دعم FBC</strong>.<br>اكتب سؤالك هنا وسنساعدك قدر الإمكان.', placeholder:'ادخل سؤالك'},
      en: {title:'FBC Support', welcome:'Welcome to FBC Support', support:'Welcome to <strong>FBC Support</strong>.<br>Type your question here and we will do our best to help.', placeholder:'Enter your question'},
      ru: {title:'Поддержка FBC', welcome:'Добро пожаловать в поддержку FBC', support:'Добро пожаловать в <strong>поддержку FBC</strong>.<br>Напишите свой вопрос здесь.', placeholder:'Введите вопрос'},
      ja: {title:'FBCサポート', welcome:'FBCサポートへようこそ', support:'<strong>FBCサポート</strong>へようこそ。<br>ここに質問を入力してください。', placeholder:'質問を入力'},
      es: {title:'Soporte FBC', welcome:'Bienvenido al soporte FBC', support:'Bienvenido a <strong>Soporte FBC</strong>.<br>Escribe tu pregunta aquí.', placeholder:'Escribe tu pregunta'},
      vi: {title:'Hỗ trợ FBC', welcome:'Chào mừng đến với Hỗ trợ FBC', support:'Chào mừng đến với <strong>Hỗ trợ FBC</strong>.<br>Hãy nhập câu hỏi của bạn tại đây.', placeholder:'Nhập câu hỏi'},
      pt: {title:'Suporte FBC', welcome:'Bem-vindo ao Suporte FBC', support:'Bem-vindo ao <strong>Suporte FBC</strong>.<br>Digite sua pergunta aqui.', placeholder:'Digite sua pergunta'},
      fr: {title:'Assistance FBC', welcome:'Bienvenue au support FBC', support:'Bienvenue au <strong>support FBC</strong>.<br>Saisissez votre question ici.', placeholder:'Entrez votre question'},
      zh: {title:'FBC 支援', welcome:'歡迎使用 FBC 支援', support:'歡迎使用 <strong>FBC 支援</strong>。<br>請在此輸入您的問題。', placeholder:'輸入您的問題'},
      id: {title:'Dukungan FBC', welcome:'Selamat datang di Dukungan FBC', support:'Selamat datang di <strong>Dukungan FBC</strong>.<br>Tulis pertanyaan Anda di sini.', placeholder:'Masukkan pertanyaan'},
      hi: {title:'FBC सहायता', welcome:'FBC सहायता में आपका स्वागत है', support:'<strong>FBC सहायता</strong> में आपका स्वागत है।<br>अपना प्रश्न यहाँ लिखें।', placeholder:'अपना प्रश्न लिखें'},
      ms: {title:'Sokongan FBC', welcome:'Selamat datang ke Sokongan FBC', support:'Selamat datang ke <strong>Sokongan FBC</strong>.<br>Taip soalan anda di sini.', placeholder:'Masukkan soalan'},
      bn: {title:'FBC সহায়তা', welcome:'FBC সহায়তায় স্বাগতম', support:'<strong>FBC সহায়তায়</strong> স্বাগতম।<br>আপনার প্রশ্ন এখানে লিখুন।', placeholder:'আপনার প্রশ্ন লিখুন'}
    };
    document.querySelectorAll('.language-option').forEach(option => {
      option.addEventListener('click', () => {
        document.querySelectorAll('.language-option').forEach(item => item.classList.remove('selected'));
        option.classList.add('selected');
        const lang = option.dataset.lang;
        const t = translations[lang] || translations.ar;
        document.getElementById('supportTitle').textContent = t.title;
        document.getElementById('welcomeMessage').textContent = t.welcome;
        document.getElementById('supportMessage').innerHTML = t.support;
        document.getElementById('chatInput').placeholder = t.placeholder;
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        languageScreen.style.display = 'none';
      });
    });

    document.getElementById('chatForm').addEventListener('submit', event => {
      event.preventDefault();
      const input = document.getElementById('chatInput');
      const value = input.value.trim();
      if (!value) return;
      const message = document.createElement('div');
      message.className = 'message user';
      message.textContent = value;
      document.getElementById('chatContent').appendChild(message);
      input.value = '';
      document.getElementById('chatContent').scrollTop = document.getElementById('chatContent').scrollHeight;
    });
  </script>
</body>
</html>
