<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>العقود الآجلة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .phone-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .content {
      width: 100%;
      height: calc(100vh - 100px);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .page-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      max-width: 430px;
      height: 100px;
      background: #000;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: flex-start;
      padding: 10px 0 12px 0;
      z-index: 100;
    }

    .nav-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.6);
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: 'Cairo', sans-serif;
      padding-top: 0;
    }

    .nav-item i {
      font-size: 24px;
      line-height: 1;
      transition: font-size 0.15s ease;
    }

    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.3px;
      line-height: 1.2;
    }

    .nav-item.active {
      color: #fff;
    }

    .nav-item.active i {
      font-size: 27px;
    }

    .nav-item:hover {
      color: #ddd;
    }

    .badge-count {
      position: absolute;
      top: 2px;
      right: 12px;
      background: #ff3366;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      min-width: 24px;
      text-align: center;
      line-height: 1.4;
      display: none;
    }

    .nav-item.home-badge .badge-count {
      display: block;
    }

    @media (max-width: 380px) {
      .nav-item i {
        font-size: 22px;
      }

      .nav-item.active i {
        font-size: 25px;
      }

      .nav-item span {
        font-size: 10px;
      }

      .page-title {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="phone-container">
    <div class="content">
      <h1 class="page-title">العقود الآجلة</h1>
    </div>

    <nav class="bottom-nav" aria-label="Bottom navigation">
      <a class="nav-item" href="wallet.html" aria-label="الرصيد">
        <i class="fa-solid fa-wallet"></i>
        <span>الرصيد</span>
      </a>

      <a class="nav-item active" href="futures.html" aria-label="العقود الآجلة">
        <i class="fa-solid fa-chart-line"></i>
        <span>العقود الآجلة</span>
      </a>

      <a class="nav-item" href="trading.html" aria-label="التداول">
        <i class="fa-solid fa-arrows-rotate"></i>
        <span>التداول</span>
      </a>

      <a class="nav-item" href="markets.html" aria-label="الأسواق">
        <i class="fa-solid fa-chart-column"></i>
        <span>الأسواق</span>
      </a>

      <a class="nav-item home-badge" href="home.html" aria-label="الصفحة الرئيسية">
        <span class="badge-count">99+</span>
        <i class="fa-solid fa-house"></i>
        <span>الرئيسية</span>
      </a>
    </nav>
  </div>
</body>
</html>
