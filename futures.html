<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دعم كوكوين</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; background: #000; color: #fff;
      font-family: 'Cairo', sans-serif; overflow: hidden;
    }
    body { display: flex; justify-content: center; align-items: center; }
    .phone-container {
      width: 100%; max-width: 430px; height: 100vh; height: 100dvh;
      background: #000; position: relative; overflow: hidden;
    }

    /* Chat screen */
    .chat-header {
      position: absolute; top: 0; left: 0; right: 0; height: 94px;
      display: flex !important; flex-direction: row !important; direction: ltr !important;
      align-items: center; padding: 0 22px; gap: 17px;
      background: #000; color: #f5f5f5; z-index: 2;
    }
    .chat-header .header-tools { order: 1; flex: 0 0 auto; }
    .chat-header .header-title { order: 2; margin-left: auto; margin-right: 0; }
    .chat-header .header-divider { order: 3; flex: 0 0 1px; }
    .chat-header .back-button { order: 4; flex: 0 0 auto; }
    .header-tools { display: flex; align-items: center; gap: 20px; direction: ltr; }
    .header-tools button, .back-button {
      border: 0; padding: 0; background: transparent; color: #f5f5f5;
      font-size: 25px; line-height: 1; cursor: pointer;
    }
    .header-title {
      display: flex; flex-direction: row; direction: ltr; align-items: center; gap: 12px; margin-right: auto;
      white-space: nowrap; font-size: 24px; font-weight: 700; color: #f2f2f2;
    }
    .robot-icon { width: 39px; height: 39px; object-fit: contain; object-position: center; border-radius: 50%; transform: none !important; scale: 1 !important; }
    .header-divider { height: 34px; width: 1px; background: #292929; }
    .back-button { font-size: 30px; }

    .chat-messages {
      position: absolute; top: 94px; bottom: 220px; left: 0; right: 0;
      overflow-y: auto; padding: 18px 28px 14px; scrollbar-width: none;
      overscroll-behavior: contain;
    }
    .chat-messages::-webkit-scrollbar { display: none; }
    .chat-date { display: none !important; }
    .message {
      margin: 0 0 14px auto; max-width: 100%;
      padding: 18px 18px 17px; border-radius: 25px;
      background: #1b1b1b; border: 1px solid #292929;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.015) inset;
      color: #bdbdbd; font-size: 16px; line-height: 1.55; font-weight: 500;
      text-align: right;
    }
    .message-title { display: block; color: #f1f1f1; font-size: 18px; line-height: 1.5; margin-bottom: 9px; }
    .faq-message { background: #1b1b1b; color: #f3f3f3; padding: 13px 17px 12px; }
    .faq-message .message-title { color: #8e929b; font-size: 19px; line-height: 1.35; margin-bottom: 8px; }
    .faq-row { display: flex; align-items: baseline; gap: 9px; color: #f2f2f2; font-size: 15px; line-height: 1.35; }
    .faq-number { flex: 0 0 20px; text-align: center; font-size: 17px; font-weight: 800; }
    .number-one { color: #ff4b68; }
    .number-two { color: #f05b78; }
    .number-three { color: #ff8a32; }
    .number-four { color: #e6b84a; }
    .number-five { color: #35c78a; }
    .number-six { color: #4ba3ff; }
    .faq-separator { height: 1px; background: #303030; margin: 5px 0; }
    .faq-hint { margin-top: 7px; color: #f2f2f2; font-size: 13px; line-height: 1.35; }
    .message.expired { display: none !important; }

    .message strong { color: #e7e7e7; font-weight: 700; }
    .message.user-message {
      background: #fff; color: #171717; border-color: #fff;
      font-weight: 500; box-shadow: none;
    }
    .message.user-message strong { color: #111; }
    .message.bot-message { white-space: pre-line; }
    .message.loading-message { color: #bdbdbd; }
    .loading-dots { display: inline-flex; gap: 5px; align-items: center; }
    .loading-dots span { width: 7px; height: 7px; border-radius: 50%; background: #bdbdbd; animation: loadingPulse 1s infinite ease-in-out; }
    .loading-dots span:nth-child(2) { animation-delay: .15s; }
    .loading-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes loadingPulse { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
    .language-screen {
      display: none; position: absolute; inset: 0; z-index: 20;
      background: #111; color: #f5f5f5; overflow-y: auto;
      font-family: 'Cairo', sans-serif;
    }
    .language-screen.open { display: block; }
    .language-header {
      height: 88px; display: flex; align-items: center; justify-content: flex-start;
      gap: 16px; padding: 0 24px; background: #111; border-bottom: 1px solid #181818;
      font-size: 22px; font-weight: 700;
    }
    .language-back { border: 0; background: transparent; color: #fff; font-size: 28px; padding: 8px; }
    .language-option {
      min-height: 66px; padding: 17px 30px; display: flex; align-items: center;
      justify-content: space-between; color: #f1f1f1; font-size: 18px;
      border: 0; width: 100%; background: transparent; text-align: right;
      font-family: inherit; cursor: pointer;
    }
    .language-option.selected { background: #1c1c1c; }
    .language-option .check { color: #fff; font-size: 19px; }

    .chat-composer {
      position: absolute; left: 26px; right: 26px; bottom: 122px; height: 88px;
      display: flex; flex-direction: row; direction: ltr !important; align-items: center; gap: 12px; padding: 0 17px 0 10px;
      border-radius: 48px; background: #1a1a1a; z-index: 3;
    }
    .chat-composer input {
      flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
      color: #f4f4f4; font-family: 'Cairo', sans-serif; font-size: 21px;
      text-align: right; direction: rtl; order: 2;
    }
    .chat-composer input::placeholder { color: #8e929b; opacity: 1; }
    .send-button {
      width: 52px; height: 52px; flex: 0 0 52px; border: 0; border-radius: 50%;
      background: #696969; color: #101010; font-size: 24px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; order: 1;
    }

    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; width: 100%; max-width: 430px;
      height: 110px; background: rgba(0, 0, 0, 0.98); border-top: 1px solid rgba(255,255,255,0.06);
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: flex-start;
      padding: 10px 12px 12px; gap: 6px; z-index: 100;
    }
    .nav-item {
      -webkit-tap-highlight-color: transparent; outline: none; position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; text-decoration: none; color: rgba(255,255,255,0.72);
      background: transparent; border: none; border-radius: 16px; padding: 10px 6px 8px;
      min-height: 70px; transition: color 0.18s ease; transform: none;
      cursor: pointer; font-family: 'Cairo', sans-serif;
    }
    .nav-item i { font-size: 24px; line-height: 1; transition: color 0.18s ease; transform: none !important; }
    .nav-item span { font-size: 11px; line-height: 1.2; font-weight: 500; letter-spacing: 0.2px; white-space: nowrap; }
    .nav-item:focus, .nav-item:focus-visible { outline: none; background: transparent; }
    .nav-item:hover { transform: none; }
    .nav-item:active { transform: none; }
    .nav-item.active { background: transparent; color: #fff; }
    .nav-item.active i { transform: none !important; color: #fff; }
    .nav-item.home-badge { position: relative; }
    .badge-count {
      position: absolute; top: 2px; right: 12px; background: #ff3f66; color: #fff;
      font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px;
      min-width: 24px; text-align: center; line-height: 1.4; display: block;
    }

    @media (max-width: 380px) {
      .chat-header { padding: 0 14px; gap: 11px; }
      .header-tools { gap: 14px; }
      .header-title { font-size: 20px; gap: 8px; }
      .robot-icon { width: 36px; height: 36px; }
      .chat-messages { padding-left: 22px; padding-right: 22px; }
      .chat-date { display: none !important; }
      .message { font-size: 16px; line-height: 1.55; padding: 16px 15px; }
      .message-title { font-size: 18px; }
      .faq-message { padding: 12px 14px 11px; }
      .faq-message .message-title { font-size: 18px; margin-bottom: 7px; }
      .faq-row { font-size: 14px; line-height: 1.32; }
      .faq-number { font-size: 16px; }
      .chat-composer { left: 18px; right: 18px; height: 76px; bottom: 118px; }
      .chat-composer input { font-size: 18px; }
    }
  </style>
</head>

    function applyLanguage(code) {
      const dict = translations[code] || translations.ar;
      document.documentElement.lang = code;
      document.documentElement.dir = dict.dir;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) el.textContent = dict[key];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (dict[key]) el.setAttribute('placeholder', dict[key]);
      });
      document.querySelector('.chat-header').style.direction = 'ltr';
      document.querySelector('.chat-messages').style.direction = dict.dir;
      document.querySelector('.chat-composer').style.direction = 'ltr';
      document.querySelector('.chat-composer').style.flexDirection = 'row';
      document.querySelector('.send-button').style.order = '1';
      document.getElementById('chatInput').style.order = '2';
      document.getElementById('chatInput').style.textAlign = code === 'ar' ? 'right' : 'left';
      document.querySelector('.faq-message').style.textAlign = dict.dir === 'rtl' ? 'right' : 'left';
      document.querySelectorAll('.faq-row').forEach(el => el.style.direction = dict.dir);
      document.querySelectorAll('.language-option').forEach(el => el.style.direction = 'ltr');
      document.querySelector('.language-header').style.direction = 'ltr';
    }

    function openLanguages() {
      const screen = document.getElementById('languageScreen');
      const holder = document.getElementById('languageOptions');
      const current = localStorage.getItem('hr-chat-language') || 'ar';
      holder.innerHTML = '';
      languageList.forEach(([name, code]) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'language-option' + (code === current ? ' selected' : '');
        button.innerHTML = `<span>${name}</span><span class="check">${code === current ? '✓' : ''}</span>`;
        button.addEventListener('click', () => {
          localStorage.setItem('hr-chat-language', code);
          applyLanguage(code);
          closeLanguages();
        });
        holder.appendChild(button);
      });
      screen.classList.add('open');
    }
    function closeLanguages() { document.getElementById('languageScreen').classList.remove('open'); }
    function showNotice(message) { if (message) alert(message); }

    const messages = document.getElementById('chatMessages');
    const MESSAGE_LIFETIME = 20 * 60 * 1000;
    const faqMessage = document.getElementById('faqMessage');
    const faqKey = 'hr-faq-message-created-at';
    let faqCreatedAt = Number(localStorage.getItem(faqKey) || 0);
    if (!faqCreatedAt || Date.now() - faqCreatedAt >= MESSAGE_LIFETIME) {
      faqCreatedAt = Date.now();
      localStorage.setItem(faqKey, String(faqCreatedAt));
    }
    faqMessage.dataset.created = String(faqCreatedAt);
    function expireOldMessages() {
      if (Date.now() - Number(faqMessage.dataset.created) >= MESSAGE_LIFETIME) {
        faqMessage.classList.add('expired');
        localStorage.removeItem(faqKey);
      }
      document.querySelectorAll('.user-message[data-created]').forEach(bubble => {
        if (Date.now() - Number(bubble.dataset.created) >= MESSAGE_LIFETIME) bubble.remove();
      });
      const stored = JSON.parse(localStorage.getItem('hr-chat-messages') || '[]');
      const fresh = stored.filter(item => item && Date.now() - Number(item.createdAt) < MESSAGE_LIFETIME);
      if (fresh.length !== stored.length) localStorage.setItem('hr-chat-messages', JSON.stringify(fresh));
    }
    function addUserMessage(text, save = true, createdAt = Date.now()) {
      const bubble = document.createElement('article');
      bubble.className = 'message user-message';
      bubble.dataset.created = String(createdAt);
      bubble.textContent = text;
      if (Date.now() - createdAt >= MESSAGE_LIFETIME) return;
      messages.appendChild(bubble);
      if (save) {
        const all = JSON.parse(localStorage.getItem('hr-chat-messages') || '[]');
        all.push({ text, createdAt });
        localStorage.setItem('hr-chat-messages', JSON.stringify(all));
      }
    }
    const savedMessages = JSON.parse(localStorage.getItem('hr-chat-messages') || '[]');
    savedMessages.forEach(item => {
      if (typeof item === 'string') addUserMessage(item, false, Date.now());
      else if (item && typeof item.text === 'string') addUserMessage(item.text, false, Number(item.createdAt) || Date.now());
    });
    expireOldMessages();
    setInterval(expireOldMessages, 5000);
    const answers = {
      '1': 'شركة FBC الإبداع الرقمي\n\nيمكنك الحصول على الأموال من خلال تقييم ومراجعة تطبيقات App Store وGoogle Play.\n\nمدة العقود: 351 يوماً.\n\nF1: 70 USDT = 3.5 دولار\nF2: 100 USDT = 5 دولارات\nF3: 300 USDT = 15 دولاراً\nF4: 500 USDT = 25 دولاراً\nF5: 800 USDT = 40 دولاراً\nF6: 1500 USDT = 75 دولاراً\nF7: 3000 USDT = 100 دولار',
      '2': 'مكافأة الاستقطاب\n\nعند استقطاب عضو من فئة F1 ستحصل على 5 USDT.\n\nعند استقطاب عضو من فئة F2 ستحصل على 8 USDT.\n\nعند استقطاب عضو من فئة F3 ستحصل على 24 USDT.\n\nعند استقطاب عضو من فئة F4 ستحصل على 40 USDT.\n\nعند استقطاب عضو من فئة F5 ستحصل على 64 USDT.\n\nعند استقطاب عضو من فئة F6 ستحصل على 120 USDT.\n\nعند استقطاب عضو من فئة F7 ستحصل على 250 USDT.',
      '3': 'يمكنك إكمال المهمات عبر الرمز الذي يتكوّن من 5 أرقام يومياً خلال 24 ساعة.\n\nأين تجد الأرقام لتفعيل المهمات؟\nيمكنك كتابة الرقم 5 في الدردشة للحصول على الأرقام.',
      '5': 'لم تتم إضافة أرقام تفعيل المهمات بعد.'
    };
    function addBotMessage(text) {
      const bubble = document.createElement('article');
      bubble.className = 'message bot-message';
      bubble.textContent = text;
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
    }
    document.getElementById('chatForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      addUserMessage(text);
      input.value = '';
      messages.scrollTop = messages.scrollHeight;

      // Answer known FAQ numbers after a short loading animation, without a network request.
      const loading = document.createElement('article');
      loading.className = 'message loading-message';
      loading.setAttribute('aria-label', 'جاري التحميل');
      loading.innerHTML = 'جاري التحميل <span class="loading-dots"><span></span><span></span><span></span></span>';
      messages.appendChild(loading);
      messages.scrollTop = messages.scrollHeight;
      window.setTimeout(() => {
        loading.remove();
        const key = text.match(/^\s*([1-6])\s*$/);
        if (key && answers[key[1]]) addBotMessage(answers[key[1]]);
        else if (key) addBotMessage('عذراً، لم تتم إضافة إجابة لهذا السؤال بعد.');
        else addBotMessage('للحصول على إجابة، اكتب رقم السؤال من 1 إلى 6.');
      }, 4000);
    });
    applyLanguage(localStorage.getItem('hr-chat-language') || 'ar');
  </script>
