<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الرصيد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:'Cairo',sans-serif}
body{display:flex;justify-content:center}
.phone{width:100%;max-width:430px;min-height:100vh;background:#000;padding:18px 0 82px;position:relative}
main{padding:0 23px}
.balance-card{height:200px;background:#2375f5;border-radius:16px;position:relative;display:flex;direction:ltr;align-items:center;overflow:hidden;padding:16px 15px;margin:0 0 18px}
.balance-art{width:43%;max-height:170px;object-fit:contain;flex:0 0 43%;background:transparent;border:0;box-shadow:none}
.balance-info{flex:1;text-align:center;min-width:0;transform:translateY(6px)}
.amount{font-family:Arial,sans-serif;font-size:clamp(48px,13vw,68px);font-weight:900;line-height:1;color:#fff;letter-spacing:1px;direction:ltr}
.reward{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:8px;direction:ltr}
.reward img{width:39px;height:46px;object-fit:contain}
.reward-value{display:inline-flex;align-items:center;justify-content:center;direction:ltr;unicode-bidi:isolate;font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:800;line-height:1.15;letter-spacing:0;color:#fff;background:transparent;padding:3px 0;border-radius:0;white-space:nowrap;word-spacing:0;text-shadow:0 0 4px rgba(255,255,255,.28)}
.progress{position:absolute;bottom:21px;left:9%;width:82%;height:13px;border-radius:20px;border:1px solid #fff;background:repeating-linear-gradient(45deg,#fff 0 7px,#5131f3 7px 14px)}
.fire{position:absolute;top:10px;right:17px;width:49px;height:49px;object-fit:contain;background:transparent;border:0;border-radius:0;padding:0;box-shadow:none}
.actions{display:flex;flex-direction:column;gap:8px}
.action{direction:ltr;height:54px;border-radius:17px;background:#2375f5;display:flex;align-items:center;padding:7px 12px;color:white;text-decoration:none;overflow:hidden;gap:8px}
.action .illustration{width:60px;height:56px;object-fit:contain;flex:0 0 60px;background:transparent;border:0;outline:0;box-shadow:none;clip-path:none}
.action .label{direction:ltr;unicode-bidi:isolate;display:flex;flex:1;align-items:center;justify-content:center;gap:2px;text-align:center;font-size:clamp(23px,6.2vw,31px);font-weight:900;line-height:1;white-space:nowrap}
.action .label b{font-family:Arial,sans-serif;font-weight:900;direction:ltr;unicode-bidi:isolate;display:inline-block}.action .label .arabic{direction:rtl;unicode-bidi:isolate;display:inline-block}
.action .ck{width:44px;height:44px;object-fit:contain;flex:0 0 44px;background:transparent;border:0;box-shadow:none}
.bottom-nav{direction:ltr;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:80px;background:#050505;border-top:1px solid #242424;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:8px 8px max(8px,env(safe-area-inset-bottom));z-index:10}
.nav-item{color:#bdbdbd;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;white-space:nowrap}
.nav-item i{font-size:29px;line-height:1}
.nav-item.active{color:#fff}
.badge{background:#ff3867;color:white;border-radius:18px;padding:2px 10px;font-size:11px;position:absolute;transform:translate(-18px,-35px)}
@media(min-width:431px){.phone{box-shadow:none}}
</style>
</head>
